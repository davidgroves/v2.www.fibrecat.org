name: Deploy to Railway

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-railway-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          SKIP_FETCH_ALBUMS: "1"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
      RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Railway config
        shell: sh
        run: |
          if [ -z "$RAILWAY_API_TOKEN" ]; then
            echo "Missing secret RAILWAY_API_TOKEN" >&2
            exit 1
          fi
          if [ -z "$RAILWAY_PROJECT_ID" ] || [ -z "$RAILWAY_SERVICE_ID" ]; then
            echo "Missing GitHub Actions variables: RAILWAY_PROJECT_ID, RAILWAY_SERVICE_ID" >&2
            exit 1
          fi

      - name: Link Railway project
        shell: sh
        run: |
          railway link \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "${RAILWAY_ENVIRONMENT:-production}" \
            --service "$RAILWAY_SERVICE_ID"

      - name: Deploy
        shell: sh
        run: railway up --detach --ci --service "$RAILWAY_SERVICE_ID"
