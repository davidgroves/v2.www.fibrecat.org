name: Deploy to Railway

# Build verification on push. Railway deploys from the GitHub integration
# connected to this repo (Settings → service → Source).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-railway-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          SKIP_FETCH_ALBUMS: "1"
